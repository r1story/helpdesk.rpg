- id: crise_switch_core
  type: crise
  titre: "Écran noir sur le LAN : Switchs Core réinitialisés"
  description: "Coupure de courant violente dans la baie principale. L'onduleur n'a pas tenu et les switchs de cœur de réseau ont rebooté sans conf : le senior n'avait jamais sauvegardé la running-config."
  unique: true
  semaine_declenchement: 12
  choix:
    - texte: "Passer la nuit blanche à reconstituer les VLANs et le routage de mémoire"
      cout_energie: 6
      impacts:
        moral: -20
        technique: 25
        promotion: 15
        relationnel: 10
      flags_ajoutes: ["sauveur_reseau"]

    - texte: "Laisser l'ingénieur réseau senior assumer l'absence de sauvegarde devant la direction"
      cout_energie: 1
      impacts:
        moral: 5
        relationnel: -25
        promotion: -5
      flags_ajoutes: ["rivalite_senior"]

    - texte: "Restaurer un vieux backup non officiel que tu avais dumpé en douce le mois dernier"
      cout_energie: 3
      impacts:
        moral: 10
        technique: 15
        promotion: 10
      flags_ajoutes: ["shadow_admin"]

