- id: special_autodidacte_dotfiles
  type: special
  titre: "Hérésie bureautique : Le poste Windows 11 d'entreprise"
  description: "Après un mois sur un poste Windows verrouillé par GPO, tes mains tremblent. Tu rêves d'un terminal en mosaïque, de raccourcis Vim et d'un noyau personnalisé."
  unique: true
  semaine_declenchement: 2
  archetype_requis: "autodidacte"
  choix:
    - texte: "Installer discrètement WSL2 avec une distribution Arch et masquer l'icône"
      cout_energie: 3
      impacts:
        moral: 25
        technique: 15
        promotion: -5
      flags_ajoutes: ["wsl_tueur"]

    - texte: "Prendre sur toi et utiliser PowerShell comme tout le monde"
      cout_energie: 1
      impacts:
        moral: -15
        technique: 5
        promotion: 10

